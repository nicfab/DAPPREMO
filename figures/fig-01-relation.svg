<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="420" height="230" role="img" aria-label="Two sets A and B, with arrows showing the ordered pairs of a relation R">
  <style>
    :root { color-scheme: light dark; }
    .ln { stroke: #1f2937; fill: none; stroke-width: 1.4; }
    .st { fill: #1f2937; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lbl { font-size: 15px; font-weight: 600; }
    .el { font-size: 13px; }
    .pr { font-size: 11px; fill: #4b5563; }
    .fa { fill: #eef2f7; stroke: #1f2937; stroke-width: 1.4; }
    .fb { fill: #fdf3e3; stroke: #1f2937; stroke-width: 1.4; }
    .ar { stroke: #4b5563; fill: none; stroke-width: 1.1; }
    .hd { fill: #4b5563; }
    @media (prefers-color-scheme: dark) {
      .ln { stroke: #e5e7eb; }
      .st { fill: #e5e7eb; }
      .pr { fill: #9ca3af; }
      .fa { fill: #1e2a38; stroke: #e5e7eb; }
      .fb { fill: #33291a; stroke: #e5e7eb; }
      .ar { stroke: #9ca3af; }
      .hd { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="hd" d="M0 0 L8 4 L0 8 z"/>
    </marker>
  </defs>

  <ellipse class="fa" cx="95" cy="125" rx="72" ry="62"/>
  <ellipse class="fb" cx="335" cy="125" rx="52" ry="62"/>

  <text class="st lbl" x="30" y="48">A</text>
  <text class="st lbl" x="378" y="48">B</text>

  <text class="st el" x="62" y="105">1</text>
  <text class="st el" x="118" y="105">2</text>
  <text class="st el" x="62" y="152">3</text>
  <text class="st el" x="118" y="152">4</text>

  <text class="st el" x="326" y="106">x</text>
  <text class="st el" x="326" y="153">y</text>

  <path class="ar" marker-end="url(#a1)" d="M72 98 C 160 55, 250 70, 318 99"/>
  <path class="ar" marker-end="url(#a1)" d="M72 100 C 150 175, 240 178, 318 150"/>
  <path class="ar" marker-end="url(#a1)" d="M72 146 C 160 122, 240 108, 318 104"/>

  <text class="st pr" x="176" y="66">(1, x)</text>
  <text class="st pr" x="176" y="181">(1, y)</text>
  <text class="st pr" x="186" y="130">(3, x)</text>

  <text class="st el" x="118" y="212">R = {(1, x), (1, y), (3, x)} ⊆ A × B</text>
</svg>
